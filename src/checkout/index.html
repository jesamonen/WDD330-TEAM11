<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
   
  </head>

  <body>
    <header class="divider"></header>

  <main class="divider">
  <section class="checkout">
    <h2>Review & Place your Order</h2>

    <div class="checkout-summary">
  <h3>Order Summary</h3>

  <p>
    Subtotal:
    <span id="subtotal">$0.00</span>
  </p>

  <p>
    Tax:
    <span id="tax">$0.00</span>
  </p>

  <p>
    Shipping Estimate:
    <span id="shipping">$0.00</span>
  </p>

  <p>
    Order Total:
    <span id="order-total">$0.00</span>
  </p>
</div>

  <form id="checkout-form">
    <label>
      First Name
      <input type="text" name="fname" required />
    </label>

    <label>
      Last Name
      <input type="text" name="lname" required />
    </label>

    <label>
      Street Address
      <input type="text" name="street" required />
    </label>

    <label>
      City
      <input type="text" name="city" required />
    </label>

    <label>
      State
      <input type="text" name="state" required />
    </label>

    <label>
      Zip Code
      <input type="text" name="zip" required />
    </label>

    <label>
      Credit Card Number
      <input type="text" name="cardNumber" required />
    </label>

    <label>
      Expiration Date
      <input type="text" name="expiration" required />
    </label>

    <label>
      Security Code
      <input type="text" name="code" required />
    </label>

    <button type="submit">Checkout</button>
</form>
  </section>
</main>
    

    <script type="module" src="../js/header.js"></script>
    <script type="module" src="../js/main.js"></script>
   <script type="module">
      import CheckoutProcess from "../js/checkoutProcess.mjs";
      import ExternalServices from "../js/ExternalServices.mjs";
      const checkout = new CheckoutProcess("so-cart", ".checkout-summary");
      const externalServices = new ExternalServices();
    
      checkout.init();
      const zipInput = document.querySelector('input[name="zip"]');
      zipInput.addEventListener("change", () => {
        checkout.calculateTax();
        checkout.calculateShipping();
        checkout.calculateOrderTotal();
      });

      const form = document.querySelector("#checkout-form");

      form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const order = checkout.checkout(form);

      const response = await externalServices.checkout(order);

      console.log(response);
    });
</script>
    
    <script type="module" src="../js/footer.js"></script>

    <footer></footer>
  </body>
</html>
