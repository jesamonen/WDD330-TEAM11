<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
   
  </head>

  <body>
    <div data-site-header></div>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <div id="order-totals" class="order-totals" aria-live="polite"></div>
        <p id="checkout-message" role="status" aria-live="polite"></p>
        <form id="checkout-form">
          <fieldset><legend>Shipping information</legend>
            <label>Full name <input name="name" autocomplete="name" required minlength="2"></label>
            <label>Email <input type="email" name="email" autocomplete="email" required></label>
            <label>Street address <input name="street" autocomplete="street-address" required></label>
            <label>City <input name="city" autocomplete="address-level2" required></label>
            <label>State / Province <input name="state" autocomplete="address-level1" required></label>
            <label>Postal code <input name="zip" autocomplete="postal-code" required pattern="[A-Za-z0-9 -]{3,10}"></label>
          </fieldset>
          <fieldset><legend>Payment information</legend>
            <label>Card number <input name="cardNumber" inputmode="numeric" autocomplete="cc-number" required pattern="[0-9 ]{12,23}" minlength="12" maxlength="23"></label>
            <label>Expiration <input name="expiration" autocomplete="cc-exp" required placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}"></label>
            <label>Security code <input name="securityCode" inputmode="numeric" autocomplete="cc-csc" required pattern="[0-9]{3,4}" minlength="3" maxlength="4"></label>
          </fieldset>
          <button type="submit">Place order</button>
        </form>
      </section>
    </main>
    <script type="module" src="../js/checkout.js"></script>

    <div data-site-footer></div>
    <script type="module" src="/js/site.js"></script>
  </body>
</html>
