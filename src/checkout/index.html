<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <form id="checkout" class="checkout-form">
          <div class="checkout__col left">
            <fieldset class="checkout__fieldset">
              <legend>Personal Information</legend>

              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" required />

              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" required />

              <label for="street">Street</label>
              <input type="text" id="street" name="street" required />

              <label for="city">City</label>
              <input type="text" id="city" name="city" required />

              <label for="state">State</label>
              <input type="text" id="state" name="state" required />

              <label for="zip">Zip Code</label>
              <input
                type="text"
                id="zip"
                name="zip"
                pattern="[0-9]{5}"
                title="Please enter a 5 digit ZIP code"
                placeholder="00000"
                required
              />
            </fieldset>

            <fieldset class="checkout__fieldset">
              <legend>Payment Information</legend>

              <label for="cardNumber">Card Number</label>
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                pattern="[0-9]{16}"
                title="Please enter the 16 digit card number"
                placeholder="0000000000000000"
                maxlength="16"
                required
              />

              <label for="cardExpiry">Expiration Date (MM/YY)</label>
              <input
                type="text"
                id="cardExpiry"
                name="cardExpiry"
                pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                title="Please enter the expiration date as MM/YY"
                placeholder="MM/YY"
                maxlength="5"
                required
              />

              <label for="cardCode">Security Code</label>
              <input
                type="text"
                id="cardCode"
                name="cardCode"
                pattern="[0-9]{3}"
                title="Please enter the 3 digit security code"
                placeholder="000"
                maxlength="3"
                required
              />
            </fieldset>
          </div>

          <div class="checkout__col right">
            <div class="checkout-summary">
              <h3>Order Summary</h3>

              <p class="checkout-subtotal">Subtotal: $0.00</p>
              <p class="checkout-tax">Tax: $0.00</p>
              <p class="checkout-shipping">Shipping: $0.00</p>
              <p class="checkout-total">Order Total: $0.00</p>

              <button type="submit" id="checkoutSubmit">Place Order</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="../js/checkout.js"></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
