<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div data-site-header></div>

    <main class="divider">
      <div class="breadcrumbs"></div>

      <section class="products">
        <h2>Top Products</h2>

      <div class="product-search">
      <input
        type="search"
        id="search"
        placeholder="Search products..."
        aria-label="Search products"
      />
      <button type="button" id="searchButton">Search</button>
      <label for="sort">Sort:</label>
      <select id="sort" aria-label="Sort products">
        <option value="default">Featured</option>
        <option value="name">Name</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
    </div>

    <ul class="product-list"></ul>
</section>
      <dialog class="quick-view" aria-labelledby="quick-view-name">
        <button type="button" class="quick-view__close" aria-label="Close quick view">&times;</button>
        <img class="quick-view__image" alt="" />
        <div class="quick-view__details">
          <p class="quick-view__brand"></p>
          <h2 id="quick-view-name"></h2>
          <p class="quick-view__price"></p>
          <p class="quick-view__discount"></p>
          <p class="quick-view__color"></p>
          <p class="quick-view__description"></p>
          <a class="quick-view__product-link">View full details</a>
        </div>
      </dialog>
    </main>

    <div data-site-footer></div>
    <script type="module" src="../js/product-listing.js"></script>
    <script type="module" src="/js/site.js"></script>
  </body>
</html>
